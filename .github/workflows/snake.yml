# 기여 그래프 뱀 애니메이션 생성 (Platane/snk 제작자 예시 워크플로 기준)
# 결과 SVG 는 output 브랜치에 올라가고, README 가 그 파일을 불러와요.
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # 매일 1번 (UTC 00:00 = 한국 09:00)
  workflow_dispatch: # Actions 탭에서 직접 실행
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7 # 배경 스크립트(scripts/decorate_snake.py)를 쓰려고

      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # 파스텔 핑크 테마 — 빈 칸도 연분홍으로 맞추고 칸 테두리를 부드럽게
          # color_dots 는 [기여 0, 적음 → 많음] 순서로 5개 (snk outputsOptions 기준)
          outputs: |
            dist/github-snake.svg?color_snake=#ff8fab&color_dots=#fff0f4,#ffd6e2,#ffb3c8,#ff8fb0,#ff6b98&color_dot_border=#ffe3ea
            dist/github-snake-dark.svg?color_snake=#ffb3c8&color_dots=#21181d,#4d2a3a,#7a3b57,#b25580,#f28cb1&color_dot_border=#2b1f25

      # snk 는 배경 그림 옵션이 없어서, 만들어진 SVG 뒤에 하늘·구름·잔디 언덕을 덧붙여요
      - name: Add sky and grass background
        run: |
          python3 scripts/decorate_snake.py dist/github-snake.svg light
          python3 scripts/decorate_snake.py dist/github-snake-dark.svg dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
